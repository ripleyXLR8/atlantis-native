[workspace]
resolver = "2"
members = ["crates/atlantis-data", "crates/atlantis-codecs", "crates/atlantis-engine", "crates/atlantis-app"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ripleyXLR8/atlantis-native"

[profile.release]
# Bit-exact results against the original need IEEE arithmetic as written;
# Rust never contracts to FMA or reorders floating point, at any level.
opt-level = 3
