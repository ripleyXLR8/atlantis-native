[workspace]
resolver = "2"
members = [
    "crates/atlantis-data",
    "crates/atlantis-codecs",
    "crates/atlantis-engine",
    "crates/atlantis2-data",
    "crates/atlantis2-engine",
    "crates/atlantis3-data",
    "crates/atlantis3-engine",
    "crates/atlantis4-data",
    "crates/atlantis4-engine",
    "crates/atlantis4-script",
    "crates/atlantis4-gl",
    "crates/atlantis-app",
    "crates/atlantis-sdl",
]

# Vendored third-party code, built as a path dependency only (its own test
# suite and dev-dependencies stay outside this workspace).
exclude = ["vendor/rilua"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/ripleyXLR8/atlantis-native"

[profile.release]
# Bit-exact results against the original need IEEE arithmetic as written;
# Rust never contracts to FMA or reorders floating point, at any level.
opt-level = 3
