[package]
name = "atlantis4-gl"
description = "Atlantis Evolution's frames drawn by the graphics card: the engine's drawing primitives through OpenGL 3.3, OpenGL ES 3.0 or WebGL 2 (glow) with the original's GL state"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
atlantis4-data = { path = "../atlantis4-data" }
atlantis4-engine = { path = "../atlantis4-engine" }
glow = "0.16"
log = "0.4"

# The web build's context (`Renderer::from_webgl2`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["WebGl2RenderingContext"] }

[dev-dependencies]
atlantis4-script = { path = "../atlantis4-script" }
glow = "0.16"

# The tests' headless context: EGL on a device (Mesa's llvmpipe or a
# graphics card), no window.
[target.'cfg(all(target_os = "linux", not(target_arch = "wasm32")))'.dev-dependencies]
glutin = { version = "0.32", default-features = false, features = ["egl"] }
