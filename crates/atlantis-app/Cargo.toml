[package]
name = "atlantis-app"
description = "Atlantis Native: window, input and audio around the game engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "atlantis-native"
path = "src/main.rs"

[dependencies]
atlantis-data = { path = "../atlantis-data" }
atlantis-codecs = { path = "../atlantis-codecs" }
atlantis-engine = { path = "../atlantis-engine" }
log = "0.4"
winit = "0.30"
softbuffer = "0.4"
cpal = "0.15"
web-time = "1"
# The identifiers of an unknown edition in the report to the project.
md-5 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
# The native folder picker and message boxes. On Linux the XDG desktop
# portal (libdbus loaded at run time, zenity as the fallback): nothing to
# link at build time.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

# The Dock icon (macOS takes it from the application, not the window).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.15", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["File", "FileList", "Blob", "Window", "Storage", "HtmlCanvasElement", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlTexture", "WebGlUniformLocation", "WebGlVertexArrayObject"] }
console_error_panic_hook = "0.1"
console_log = "1"

[build-dependencies]
# The Windows program file's icon resource (rc.exe or windres).
embed-resource = "3"
