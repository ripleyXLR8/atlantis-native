[package]
name = "atlantis-app"
description = "Atlantis Native: window, input and audio around the game engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "atlantis-native"
path = "src/main.rs"

[dependencies]
atlantis-data = { path = "../atlantis-data" }
atlantis-codecs = { path = "../atlantis-codecs" }
atlantis-engine = { path = "../atlantis-engine" }
log = "0.4"
winit = "0.30"
softbuffer = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["File", "FileList", "Blob"] }
console_error_panic_hook = "0.1"
console_log = "1"
