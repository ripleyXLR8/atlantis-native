[package]
name = "atlantis4-engine"
description = "Atlantis Evolution engine: the warp view (cube, camera, view angles, clicks, markers) and, later, the scripts, videos and dialogs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
atlantis-data = { path = "../atlantis-data" }
atlantis4-data = { path = "../atlantis4-data" }
# The same results on every platform: the trigonometry of the camera is not
# left to each system's mathematics library.
libm = "=0.2.16"

[dev-dependencies]
md-5 = "0.10"
png = "0.18"
