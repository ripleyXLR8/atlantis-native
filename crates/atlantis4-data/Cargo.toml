[package]
name = "atlantis4-data"
description = "Atlantis Evolution data files: game detection, the file layer, warp packages, scenes, scripts, texts, fonts, pictures and sounds"
version.workspace = true
edition.workspace = true
license.workspace = true

# Third-party decoders are pure Rust and build for wasm32-unknown-unknown
# (the web build).
[dependencies]
atlantis-data = { path = "../atlantis-data" }
encoding_rs = "0.8"
lewton = "0.10"
md-5 = "0.10"
miniz_oxide = "0.8"
png = "0.18"
